<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseGuard | AI Driver Safety</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.png') }}">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#161920',
                        tertiary: '#1E232D',
                        dark: '#0F1115'
                    }
                }
            }
        }
    </script>
    
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="bg-dark text-slate-100 min-h-screen flex flex-col relative">
    <canvas id="bgCanvas" class="fixed inset-0 w-full h-full -z-10 pointer-events-none"></canvas>
    
    {% include 'navbar.html' %}

    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-800 py-6 text-center text-sm text-gray-500 mt-auto">
        <p>&copy; 2026 PoseGuard Driver Safety Monitoring.</p>
    </footer>

    <!-- Custom Scripts -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
