{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh] py-8">
    <div class="glass-card w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-500/10 mb-4">
                <i class="fa-solid fa-user-plus text-blue-400 text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Create an Account</h2>
            <p class="text-gray-400 text-sm">Join PoseGuard to start monitoring</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-lg text-sm mb-6 flex items-start gap-2">
            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-id-card text-gray-500 text-sm"></i>
                    </div>
                    <input type="text" name="name" placeholder="John Doe" class="input-field pl-10 !mb-0" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-500 text-sm"></i>
                    </div>
                    <input type="text" name="username" placeholder="johndoe123" class="input-field pl-10 !mb-0" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-gray-500 text-sm"></i>
                    </div>
                    <input type="email" name="email" placeholder="john@example.com" class="input-field pl-10 !mb-0" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-500 text-sm"></i>
                    </div>
                    <input type="password" name="password" placeholder="••••••••" class="input-field pl-10 !mb-0" required>
                </div>
                <p class="text-xs text-gray-500 mt-2">Must be 8+ chars with a number, letter, and special character.</p>
            </div>

            <div class="pt-2">
                <button type="submit" class="btn-primary w-full shadow-lg shadow-blue-500/20">
                    Create Account
                </button>
            </div>
        </form>

        <p class="text-gray-400 text-sm mt-8 text-center">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-blue-400 font-medium hover:text-blue-300 transition-colors">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
